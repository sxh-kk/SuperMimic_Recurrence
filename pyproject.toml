[project]
name = "supermimic"
version = "0.1.0"
description = "Reproduction of SuperMimic (arXiv 2610.28480): one differentiable world model + BPTT for humanoid whole-body tracking, on mjlab / MuJoCo Warp"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  # Base framework, pinned to the exact commit the plan was written against (main, 2026-10-18).
  "mjlab",
  # Declared directly so that our [tool.uv.sources] below apply (mjlab's own sources do not propagate).
  "torch==2.14.1",
  "warp-lang==1.18.0+cu12",
  "mujoco-warp==3.16.0",
  "mujoco==3.16.0",
  "numpy",
  "scipy>=1.15",
  "tensorboard>=2.20.0",
  "tyro>=1.0.1",
  "huggingface-hub>=0.30",
  "pandas",
  "pyarrow",
  "tqdm",
]

[project.scripts]
sm-train = "supermimic.scripts.train:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "pyright>=1.1.400",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supermimic"]

[tool.uv.sources]
mjlab = { git = "https://github.com/mujocolab/mjlab", rev = "8bb2bc9e187797689ec82c78c35019afd2fd0376" }
torch = { index = "pytorch-cu126" }
warp-lang = { url = "https://github.com/NVIDIA/warp/releases/download/v1.18.0/warp_lang-1.18.0%2Bcu12-py3-none-manylinux_2_28_x86_64.whl" }

[tool.uv]
# This lock targets the local CUDA 12 workstation, including its native wheels.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
